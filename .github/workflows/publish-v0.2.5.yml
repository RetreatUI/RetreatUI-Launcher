name: Publish RetreatUI Launcher v0.2.5

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: publish-retreatui-launcher-v0.2.5
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'release/launcher-v0.2.5'
    runs-on: windows-latest

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply addon release selection hotfix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          @'
          namespace RetreatUI.Launcher.Services;

          public readonly record struct AddonVersion(
              int Major,
              int Minor,
              int Patch,
              bool IsPrerelease,
              string Prerelease) : IComparable<AddonVersion>
          {
              public static AddonVersion Parse(string? value)
              {
                  string normalized = (value ?? string.Empty).Trim().TrimStart('v', 'V');
                  string[] split = normalized.Split('-', 2, StringSplitOptions.RemoveEmptyEntries);
                  string[] core = split.Length > 0
                      ? split[0].Split('.', StringSplitOptions.RemoveEmptyEntries)
                      : Array.Empty<string>();

                  int major = core.Length > 0 && int.TryParse(core[0], out int ma) ? ma : 0;
                  int minor = core.Length > 1 && int.TryParse(core[1], out int mi) ? mi : 0;
                  int patch = core.Length > 2 && int.TryParse(core[2], out int pa) ? pa : 0;
                  string prerelease = split.Length > 1 ? split[1] : string.Empty;

                  return new AddonVersion(major, minor, patch, prerelease.Length > 0, prerelease);
              }

              public static int Compare(string? left, string? right) =>
                  Parse(left).CompareTo(Parse(right));

              public int CompareTo(AddonVersion other)
              {
                  int result = Major.CompareTo(other.Major);
                  if (result != 0) return result;

                  result = Minor.CompareTo(other.Minor);
                  if (result != 0) return result;

                  result = Patch.CompareTo(other.Patch);
                  if (result != 0) return result;

                  if (IsPrerelease != other.IsPrerelease)
                  {
                      return IsPrerelease ? -1 : 1;
                  }

                  return IsPrerelease
                      ? ComparePrerelease(Prerelease, other.Prerelease)
                      : 0;
              }

              private static int ComparePrerelease(string leftValue, string rightValue)
              {
                  string[] left = leftValue.Split('.', StringSplitOptions.RemoveEmptyEntries);
                  string[] right = rightValue.Split('.', StringSplitOptions.RemoveEmptyEntries);
                  int count = Math.Max(left.Length, right.Length);

                  for (int index = 0; index < count; index++)
                  {
                      if (index >= left.Length) return -1;
                      if (index >= right.Length) return 1;

                      string leftIdentifier = left[index];
                      string rightIdentifier = right[index];
                      bool leftNumeric = int.TryParse(leftIdentifier, out int leftNumber);
                      bool rightNumeric = int.TryParse(rightIdentifier, out int rightNumber);

                      int result;
                      if (leftNumeric && rightNumeric)
                      {
                          result = leftNumber.CompareTo(rightNumber);
                      }
                      else if (leftNumeric != rightNumeric)
                      {
                          result = leftNumeric ? -1 : 1;
                      }
                      else
                      {
                          result = string.Compare(
                              leftIdentifier,
                              rightIdentifier,
                              StringComparison.OrdinalIgnoreCase);
                      }

                      if (result != 0)
                      {
                          return result;
                      }
                  }

                  return 0;
              }
          }
          '@ | Set-Content -Path 'RetreatUI.Launcher/Services/AddonVersion.cs' -Encoding utf8

          @'
          using System.Collections.Generic;
          using System.IO;
          using System.Linq;
          using System.Net.Http;
          using System.Net.Http.Headers;
          using System.Text.Json;
          using System.Threading;
          using System.Threading.Tasks;
          using RetreatUI.Launcher.Models;

          namespace RetreatUI.Launcher.Services;

          public sealed class GitHubReleaseService
          {
              private const string ReleasesUrl = "https://api.github.com/repos/RetreatUI/RetreatUI-Addon/releases?per_page=100";
              private readonly HttpClient _httpClient;

              public GitHubReleaseService()
              {
                  _httpClient = new HttpClient
                  {
                      Timeout = TimeSpan.FromSeconds(30)
                  };
                  _httpClient.DefaultRequestHeaders.UserAgent.Add(
                      new ProductInfoHeaderValue("RetreatUI-Launcher", "0.2.5"));
                  _httpClient.DefaultRequestHeaders.Accept.Add(
                      new MediaTypeWithQualityHeaderValue("application/vnd.github+json"));
              }

              public async Task<GitHubRelease?> GetLatestReleaseAsync(
                  bool includeBeta,
                  CancellationToken cancellationToken = default)
              {
                  string requestUrl =
                      $"{ReleasesUrl}&cache_bust={DateTimeOffset.UtcNow.ToUnixTimeMilliseconds()}";
                  using HttpRequestMessage request = new(HttpMethod.Get, requestUrl);
                  request.Headers.CacheControl = new CacheControlHeaderValue
                  {
                      NoCache = true,
                      NoStore = true
                  };
                  request.Headers.Pragma.ParseAdd("no-cache");

                  using HttpResponseMessage response = await _httpClient.SendAsync(
                      request,
                      HttpCompletionOption.ResponseHeadersRead,
                      cancellationToken);
                  response.EnsureSuccessStatusCode();

                  await using Stream stream = await response.Content.ReadAsStreamAsync(cancellationToken);
                  List<GitHubRelease> releases = await JsonSerializer.DeserializeAsync<List<GitHubRelease>>(
                      stream,
                      cancellationToken: cancellationToken) ?? new List<GitHubRelease>();

                  IEnumerable<GitHubRelease> candidates = releases.Where(release => !release.Draft);
                  if (!includeBeta)
                  {
                      candidates = candidates.Where(release => !release.Prerelease);
                  }

                  return candidates
                      .Where(HasRetreatUiAsset)
                      .OrderByDescending(release => AddonVersion.Parse(release.TagName))
                      .ThenByDescending(release => release.PublishedAt)
                      .FirstOrDefault();
              }

              public static GitHubAsset? FindRetreatUiAsset(GitHubRelease release)
              {
                  return release.Assets.FirstOrDefault(asset =>
                      asset.Name.StartsWith("RetreatUI_v", StringComparison.OrdinalIgnoreCase)
                      && asset.Name.EndsWith(".zip", StringComparison.OrdinalIgnoreCase));
              }

              public async Task DownloadAssetAsync(
                  GitHubAsset asset,
                  string destinationPath,
                  IProgress<double>? progress = null,
                  CancellationToken cancellationToken = default)
              {
                  using HttpResponseMessage response = await _httpClient.GetAsync(
                      asset.BrowserDownloadUrl,
                      HttpCompletionOption.ResponseHeadersRead,
                      cancellationToken);
                  response.EnsureSuccessStatusCode();

                  long? total = response.Content.Headers.ContentLength;
                  await using Stream input = await response.Content.ReadAsStreamAsync(cancellationToken);
                  await using FileStream output = new(destinationPath, FileMode.Create, FileAccess.Write, FileShare.None);

                  byte[] buffer = new byte[81920];
                  long received = 0;
                  int read;
                  while ((read = await input.ReadAsync(buffer, cancellationToken)) > 0)
                  {
                      await output.WriteAsync(buffer.AsMemory(0, read), cancellationToken);
                      received += read;
                      if (total is > 0)
                      {
                          progress?.Report(received * 100d / total.Value);
                      }
                  }
              }

              private static bool HasRetreatUiAsset(GitHubRelease release) =>
                  FindRetreatUiAsset(release) is not null;
          }
          '@ | Set-Content -Path 'RetreatUI.Launcher/Services/GitHubReleaseService.cs' -Encoding utf8

          $mainWindowPath = 'RetreatUI.Launcher/MainWindow.xaml.cs'
          $mainWindow = Get-Content $mainWindowPath -Raw

          $oldComparison = @'
                  int coreComparison = CompareCoreVersions(installed, latestVersion);
                  bool installedPrerelease = HasPrereleaseLabel(installed);
          '@
          $newComparison = @'
                  int coreComparison = CompareCoreVersions(installed, latestVersion);
                  int fullComparison = AddonVersion.Compare(installed, latestVersion);
                  bool installedPrerelease = HasPrereleaseLabel(installed);
          '@
          if (-not $mainWindow.Contains($oldComparison)) {
            throw 'Could not locate the addon version comparison block.'
          }
          $mainWindow = $mainWindow.Replace($oldComparison, $newComparison)

          $oldNewerGuard = @'
                  if (coreComparison > 0)
                  {
                      SetAddonAction(
                          AddonAction.None,
                          "INSTALLED VERSION IS NEWER",
                          false,
                          $"RetreatUI {installed} is newer than the latest selected-channel release.",
                          StatusKind.Neutral);
                      return;
                  }
          '@
          $newNewerGuard = @'
                  if (fullComparison == 0)
                  {
                      SetAddonAction(
                          AddonAction.None,
                          "RETREATUI IS UP TO DATE",
                          false,
                          $"RetreatUI {installed} is up to date.",
                          StatusKind.Success);
                      return;
                  }

                  if (fullComparison > 0)
                  {
                      SetAddonAction(
                          AddonAction.None,
                          "INSTALLED VERSION IS NEWER",
                          false,
                          $"RetreatUI {installed} is newer than the latest selected-channel release.",
                          StatusKind.Neutral);
                      return;
                  }
          '@
          if (-not $mainWindow.Contains($oldNewerGuard)) {
            throw 'Could not locate the existing addon downgrade UI guard.'
          }
          $mainWindow = $mainWindow.Replace($oldNewerGuard, $newNewerGuard)

          $oldInstallPoint = @'
                  AddonAction completedAction = _currentAddonAction;
                  string latestVersion = NormalizeVersion(_latestRelease.TagName);
                  string tempDirectory = Path.Combine(Path.GetTempPath(), "RetreatUI-Launcher");
          '@
          $newInstallPoint = @'
                  AddonAction completedAction = _currentAddonAction;
                  string latestVersion = NormalizeVersion(_latestRelease.TagName);

                  if (_currentAddonAction == AddonAction.Update
                      && AddonVersion.Compare(latestVersion, InstalledVersionText.Text) <= 0)
                  {
                      _currentAddonAction = AddonAction.None;
                      UpdateButton.Content = "INSTALLED VERSION IS NEWER";
                      UpdateButton.IsEnabled = false;
                      SetStatus(
                          $"RetreatUI {InstalledVersionText.Text} is newer than {latestVersion}. Downgrade blocked.",
                          StatusKind.Neutral);
                      return;
                  }

                  string tempDirectory = Path.Combine(Path.GetTempPath(), "RetreatUI-Launcher");
          '@
          if (-not $mainWindow.Contains($oldInstallPoint)) {
            throw 'Could not locate the addon installation entry point.'
          }
          $mainWindow = $mainWindow.Replace($oldInstallPoint, $newInstallPoint)
          Set-Content -Path $mainWindowPath -Value $mainWindow -Encoding utf8

          $launcherUpdatePath = 'RetreatUI.Launcher/Services/LauncherUpdateService.cs'
          $launcherUpdate = Get-Content $launcherUpdatePath -Raw
          $launcherUpdate = $launcherUpdate.Replace('?? "0.2.4";', '?? "0.2.5";')
          Set-Content -Path $launcherUpdatePath -Value $launcherUpdate -Encoding utf8

          $projectPath = 'RetreatUI.Launcher/RetreatUI.Launcher.csproj'
          $project = Get-Content $projectPath -Raw
          $project = $project.Replace('<Version>0.2.4</Version>', '<Version>0.2.5</Version>')
          $project = $project.Replace('<FileVersion>0.2.4.0</FileVersion>', '<FileVersion>0.2.5.0</FileVersion>')
          $project = $project.Replace('<AssemblyVersion>0.2.4.0</AssemblyVersion>', '<AssemblyVersion>0.2.5.0</AssemblyVersion>')
          Set-Content -Path $projectPath -Value $project -Encoding utf8

          $readmePath = 'README.md'
          $readme = Get-Content $readmePath -Raw
          $readme = $readme.Replace('`0.2.4`', '`0.2.5`')
          $readme = $readme.Replace('launcher-v0.2.4', 'launcher-v0.2.5')
          $feature = '- Automatic release checks through the RetreatUI GitHub releases feed'
          $replacement = @'
          - Automatic release checks through the RetreatUI GitHub releases feed
          - Full Stable/Beta semantic version ordering with hard addon downgrade protection
          '@
          $replacement = $replacement.Trim()
          if ($readme.Contains($feature) -and -not $readme.Contains('hard addon downgrade protection')) {
            $readme = $readme.Replace($feature, $replacement)
          }
          Set-Content -Path $readmePath -Value $readme -Encoding utf8

      - name: Validate patched source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = Get-Content 'RetreatUI.Launcher/Services/AddonVersion.cs' -Raw
          $release = Get-Content 'RetreatUI.Launcher/Services/GitHubReleaseService.cs' -Raw
          $window = Get-Content 'RetreatUI.Launcher/MainWindow.xaml.cs' -Raw
          $project = Get-Content 'RetreatUI.Launcher/RetreatUI.Launcher.csproj' -Raw

          if (-not $version.Contains('ComparePrerelease')) {
            throw 'Full prerelease comparison is missing.'
          }
          if (-not $release.Contains('cache_bust=')) {
            throw 'Release cache bypass is missing.'
          }
          if (-not $release.Contains('NoCache = true')) {
            throw 'No-cache request header is missing.'
          }
          if (-not $release.Contains('OrderByDescending(release => AddonVersion.Parse(release.TagName))')) {
            throw 'Semantic release ordering is missing.'
          }
          if (-not $window.Contains('AddonVersion.Compare(installed, latestVersion)')) {
            throw 'Addon UI semantic comparison is missing.'
          }
          if (-not $window.Contains('Downgrade blocked.')) {
            throw 'Installation-time addon downgrade guard is missing.'
          }
          if (-not $project.Contains('<Version>0.2.5</Version>')) {
            throw 'Launcher version was not bumped to 0.2.5.'
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore RetreatUI.Launcher.sln

      - name: Run addon version ordering smoke tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path 'version-smoke' -Force | Out-Null

          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <Compile Include="../RetreatUI.Launcher/Services/AddonVersion.cs" Link="AddonVersion.cs" />
            </ItemGroup>
          </Project>
          '@ | Set-Content -Path 'version-smoke/version-smoke.csproj' -Encoding utf8

          @'
          using RetreatUI.Launcher.Services;

          static void Assert(bool condition, string message)
          {
              if (!condition)
              {
                  throw new InvalidOperationException(message);
              }
          }

          Assert(AddonVersion.Compare("1.1.0-beta.5", "1.1.0-beta.4") > 0, "beta.5 must be newer than beta.4");
          Assert(AddonVersion.Compare("1.1.0-beta.10", "1.1.0-beta.5") > 0, "beta.10 must be newer than beta.5");
          Assert(AddonVersion.Compare("1.1.0", "1.1.0-beta.99") > 0, "stable must be newer than prerelease");
          Assert(AddonVersion.Compare("1.2.0-beta.1", "1.1.99") > 0, "newer core prerelease must win");
          Assert(AddonVersion.Compare("v1.1.0-beta.5", "1.1.0-beta.5") == 0, "leading v must be ignored");
          Console.WriteLine("Addon version ordering tests passed.");
          '@ | Set-Content -Path 'version-smoke/Program.cs' -Encoding utf8

          dotnet run --project version-smoke/version-smoke.csproj --configuration Release

      - name: Build launcher
        run: dotnet build RetreatUI.Launcher.sln --configuration Release --no-restore

      - name: Publish single EXE
        run: >-
          dotnet publish RetreatUI.Launcher/RetreatUI.Launcher.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output publish

      - name: Verify launcher startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $executable = (Resolve-Path 'publish/RetreatUI_Launcher.exe').Path

          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes

          $process = Start-Process -FilePath $executable -PassThru
          try {
            Start-Sleep -Seconds 10
            $process.Refresh()
            if ($process.HasExited) {
              throw "Launcher exited during startup with code $($process.ExitCode)."
            }

            $root = [System.Windows.Automation.AutomationElement]::RootElement
            $condition = New-Object System.Windows.Automation.PropertyCondition(
              [System.Windows.Automation.AutomationElement]::ProcessIdProperty,
              $process.Id)
            $windows = $root.FindAll(
              [System.Windows.Automation.TreeScope]::Children,
              $condition)
            if ($windows.Count -ne 1) {
              throw "Expected one launcher window, found $($windows.Count)."
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path publish/RetreatUI_Launcher.exe -DestinationPath RetreatUI_Launcher_win-x64.zip -Force

      - name: Commit v0.2.5 source to main
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item 'version-smoke' -Recurse -Force -ErrorAction SilentlyContinue

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add `
            RetreatUI.Launcher/Services/AddonVersion.cs `
            RetreatUI.Launcher/Services/GitHubReleaseService.cs `
            RetreatUI.Launcher/Services/LauncherUpdateService.cs `
            RetreatUI.Launcher/MainWindow.xaml.cs `
            RetreatUI.Launcher/RetreatUI.Launcher.csproj `
            README.md
          git rm .github/workflows/publish-v0.2.5.yml
          git commit -m 'Fix beta release ordering and release launcher v0.2.5'
          git push origin HEAD:main

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetreatUI-Launcher-v0.2.5-win-x64
          path: |
            publish/RetreatUI_Launcher.exe
            RetreatUI_Launcher_win-x64.zip
          if-no-files-found: error

      - name: Publish stable GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          @'
          ## RetreatUI Launcher v0.2.5

          ### Beta channel fix
          - Correctly orders full addon prerelease versions, including beta.4, beta.5 and beta.10.
          - Prevents an installed newer beta from ever being offered an older beta as an update.
          - Adds a second downgrade guard immediately before download and installation.

          ### Fresh release checks
          - Bypasses stale GitHub release-list caching during refresh.
          - Requests up to 100 releases and selects the highest valid Stable or Beta build by semantic version.
          '@ | Set-Content -Path 'launcher-v0.2.5-notes.md' -Encoding utf8

          gh release view 'launcher-v0.2.5' --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload 'launcher-v0.2.5' `
              publish/RetreatUI_Launcher.exe `
              RetreatUI_Launcher_win-x64.zip `
              --repo "$env:GITHUB_REPOSITORY" `
              --clobber
            gh release edit 'launcher-v0.2.5' `
              --repo "$env:GITHUB_REPOSITORY" `
              --title 'RetreatUI Launcher v0.2.5' `
              --notes-file 'launcher-v0.2.5-notes.md' `
              --latest
          }
          else {
            gh release create 'launcher-v0.2.5' `
              publish/RetreatUI_Launcher.exe `
              RetreatUI_Launcher_win-x64.zip `
              --repo "$env:GITHUB_REPOSITORY" `
              --target "$(git rev-parse HEAD)" `
              --title 'RetreatUI Launcher v0.2.5' `
              --notes-file 'launcher-v0.2.5-notes.md' `
              --latest
          }
