name: Launcher CI and Release

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "RetreatUI.Launcher/**"
      - "RetreatUI.Launcher.sln"
      - ".github/workflows/build.yml"
  push:
    branches: [main]
    paths:
      - "RetreatUI.Launcher/**"
      - "RetreatUI.Launcher.sln"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify .NET 8 SDK
        shell: pwsh
        run: |
          $sdks = dotnet --list-sdks
          Write-Host $sdks
          if ($LASTEXITCODE -ne 0 -or -not ($sdks -match '^8\.0\.')) {
            throw ".NET 8 SDK is not available on the self-hosted runner."
          }

      - name: Restore
        run: dotnet restore RetreatUI.Launcher.sln

      - name: Build
        run: dotnet build RetreatUI.Launcher.sln --configuration Release --no-restore

  release:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify .NET 8 SDK
        shell: pwsh
        run: |
          $sdks = dotnet --list-sdks
          Write-Host $sdks
          if ($LASTEXITCODE -ne 0 -or -not ($sdks -match '^8\.0\.')) {
            throw ".NET 8 SDK is not available on the self-hosted runner."
          }

      - name: Read and validate launcher version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content -LiteralPath "RetreatUI.Launcher/RetreatUI.Launcher.csproj"
          $version = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Launcher Version is missing." }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid launcher version: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=launcher-v$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore RetreatUI.Launcher.sln

      - name: Publish single EXE
        run: >-
          dotnet publish RetreatUI.Launcher/RetreatUI.Launcher.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output publish

      - name: Validate binary and create release assets
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $exe = "publish/RetreatUI_Launcher.exe"
          if (!(Test-Path -LiteralPath $exe)) { throw "Launcher EXE was not created." }

          $fileVersion = (Get-Item -LiteralPath $exe).VersionInfo.FileVersion
          if (!$fileVersion.StartsWith($version)) {
            throw "Binary version $fileVersion does not match project version $version."
          }

          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RetreatUI_Launcher.exe" | Set-Content -LiteralPath "publish/RetreatUI_Launcher.exe.sha256" -Encoding ascii
          Compress-Archive -Path $exe -DestinationPath "publish/RetreatUI_Launcher_win-x64.zip" -Force

          if ((Get-Item -LiteralPath $exe).Length -lt 1000000) { throw "Launcher EXE is unexpectedly small." }
          if ((Get-Item -LiteralPath "publish/RetreatUI_Launcher_win-x64.zip").Length -lt 1000000) { throw "Launcher ZIP is unexpectedly small." }

      - name: Publish verified GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:TAG already exists. Validation succeeded; no duplicate release created."
            exit 0
          }

          @"
          ## RetreatUI Launcher $env:VERSION

          - Removes blurred edition-card artwork and keeps selected text sharp.
          - Corrects the Burning Crusade label.
          - Uses only verified GitHub release assets for Latest on channel.
          - Compares public feeds with live GitHub releases and rejects stale or invalid entries.
          - Includes SHA-256 verification assets.
          "@ | Set-Content -LiteralPath release-notes.md -Encoding utf8

          gh release create $env:TAG `
            "publish/RetreatUI_Launcher.exe" `
            "publish/RetreatUI_Launcher.exe.sha256" `
            "publish/RetreatUI_Launcher_win-x64.zip" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "RetreatUI Launcher v$env:VERSION" `
            --notes-file release-notes.md `
            --latest

      - name: Verify public release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $release = gh api "/repos/$env:GITHUB_REPOSITORY/releases/tags/$env:TAG" | ConvertFrom-Json
          $required = @(
            "RetreatUI_Launcher.exe",
            "RetreatUI_Launcher.exe.sha256",
            "RetreatUI_Launcher_win-x64.zip"
          )
          foreach ($name in $required) {
            $asset = $release.assets | Where-Object { $_.name -eq $name }
            if (!$asset) { throw "Missing release asset: $name" }
            if ([int64]$asset.size -le 0) { throw "Release asset has invalid size: $name" }
            if ($asset.browser_download_url -notlike "*/releases/download/*") {
              throw "Release asset has invalid download URL: $name"
            }
          }
