name: Build RetreatUI Launcher

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "RetreatUI.Launcher/**"
      - "RetreatUI.Launcher.sln"
      - ".github/workflows/build.yml"
  push:
    tags:
      - "launcher-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore RetreatUI.Launcher.sln

      - name: Publish single EXE
        run: >-
          dotnet publish RetreatUI.Launcher/RetreatUI.Launcher.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output publish

      - name: Create checksum and ZIP
        shell: pwsh
        run: |
          $exe = "publish/RetreatUI_Launcher.exe"
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RetreatUI_Launcher.exe" | Set-Content -LiteralPath "publish/RetreatUI_Launcher.exe.sha256" -Encoding ascii
          Compress-Archive -Path $exe -DestinationPath RetreatUI_Launcher_win-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetreatUI-Launcher-win-x64
          path: |
            publish/RetreatUI_Launcher.exe
            publish/RetreatUI_Launcher.exe.sha256
            RetreatUI_Launcher_win-x64.zip

      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/launcher-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/RetreatUI_Launcher.exe
            publish/RetreatUI_Launcher.exe.sha256
            RetreatUI_Launcher_win-x64.zip
          generate_release_notes: true
