name: Launcher CI and Release

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "RetreatUI.Launcher/**"
      - "RetreatUI.Launcher.sln"
      - ".github/workflows/build.yml"
  push:
    branches: [main]
    paths:
      - "RetreatUI.Launcher/**"
      - "RetreatUI.Launcher.sln"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and release
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sdks = dotnet --list-sdks
          Write-Host $sdks
          if ($LASTEXITCODE -ne 0 -or -not ($sdks -match '^8\.0\.')) {
            throw ".NET 8 SDK is not available on the self-hosted runner."
          }

          if (!(Get-Command git -ErrorAction SilentlyContinue)) {
            throw "Git is not available on the self-hosted runner."
          }

          if (!(Get-Command pwsh -ErrorAction SilentlyContinue)) {
            throw "PowerShell 7 is not available on the self-hosted runner."
          }

          if ("${{ github.event_name }}" -ne "pull_request" -and !(Get-Command gh -ErrorAction SilentlyContinue)) {
            throw "GitHub CLI is not available on the self-hosted runner."
          }

      - name: Read and validate launcher version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          [xml]$project = Get-Content -LiteralPath "RetreatUI.Launcher/RetreatUI.Launcher.csproj"
          $version = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)

          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Launcher Version is missing."
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid launcher version: $version"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=launcher-v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Launcher version: $version"

      - name: Restore
        shell: pwsh
        run: dotnet restore RetreatUI.Launcher.sln

      - name: Build
        shell: pwsh
        run: dotnet build RetreatUI.Launcher.sln --configuration Release --no-restore

      - name: Publish single EXE
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          dotnet publish RetreatUI.Launcher/RetreatUI.Launcher.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            --output publish

      - name: Validate binary and create release assets
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "publish/RetreatUI_Launcher.exe"
          $zip = "publish/RetreatUI_Launcher_win-x64.zip"
          $checksum = "publish/RetreatUI_Launcher.exe.sha256"

          if (!(Test-Path -LiteralPath $exe)) {
            throw "Launcher EXE was not created."
          }

          $fileVersion = (Get-Item -LiteralPath $exe).VersionInfo.FileVersion
          if ([string]::IsNullOrWhiteSpace($fileVersion) -or !$fileVersion.StartsWith($env:VERSION)) {
            throw "Binary version $fileVersion does not match project version $env:VERSION."
          }

          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RetreatUI_Launcher.exe" | Set-Content -LiteralPath $checksum -Encoding ascii
          Compress-Archive -Path $exe -DestinationPath $zip -Force

          if ((Get-Item -LiteralPath $exe).Length -lt 1000000) {
            throw "Launcher EXE is unexpectedly small."
          }

          if ((Get-Item -LiteralPath $zip).Length -lt 1000000) {
            throw "Launcher ZIP is unexpectedly small."
          }

      - name: Create or update GitHub release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"

          @"
          ## RetreatUI Launcher $env:VERSION

          - Removes blurred edition-card artwork and keeps selected text sharp.
          - Corrects the Burning Crusade label.
          - Uses only verified GitHub release assets for Latest on channel.
          - Compares public feeds with live GitHub releases and rejects stale or invalid entries.
          - Includes SHA-256 verification assets.
          "@ | Set-Content -LiteralPath release-notes.md -Encoding utf8

          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          $exists = $LASTEXITCODE -eq 0

          if ($exists) {
            Write-Host "Updating existing release $env:TAG"
            gh release edit $env:TAG `
              --repo $env:GITHUB_REPOSITORY `
              --title "RetreatUI Launcher v$env:VERSION" `
              --notes-file release-notes.md `
              --latest

            gh release upload $env:TAG `
              "publish/RetreatUI_Launcher.exe" `
              "publish/RetreatUI_Launcher.exe.sha256" `
              "publish/RetreatUI_Launcher_win-x64.zip" `
              --repo $env:GITHUB_REPOSITORY `
              --clobber
          }
          else {
            Write-Host "Creating release $env:TAG"
            gh release create $env:TAG `
              "publish/RetreatUI_Launcher.exe" `
              "publish/RetreatUI_Launcher.exe.sha256" `
              "publish/RetreatUI_Launcher_win-x64.zip" `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title "RetreatUI Launcher v$env:VERSION" `
              --notes-file release-notes.md `
              --latest
          }

      - name: Verify public release assets
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $release = gh api "/repos/$env:GITHUB_REPOSITORY/releases/tags/$env:TAG" | ConvertFrom-Json
          $required = @(
            "RetreatUI_Launcher.exe",
            "RetreatUI_Launcher.exe.sha256",
            "RetreatUI_Launcher_win-x64.zip"
          )

          foreach ($name in $required) {
            $asset = $release.assets | Where-Object { $_.name -eq $name }
            if (!$asset) {
              throw "Missing release asset: $name"
            }
            if ([int64]$asset.size -le 0) {
              throw "Release asset has invalid size: $name"
            }
            if ($asset.browser_download_url -notlike "*/releases/download/*") {
              throw "Release asset has invalid download URL: $name"
            }
          }

          if ($release.tag_name -ne $env:TAG) {
            throw "Published release tag does not match $env:TAG."
          }

          Write-Host "Release $env:TAG verified successfully."
