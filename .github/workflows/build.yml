name: Build RetreatUI Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "launcher-v*"
    paths:
      - "RetreatUI.Launcher/**"
      - "RetreatUI.Launcher.sln"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: retreatui-launcher-release
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read launcher version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content -LiteralPath "RetreatUI.Launcher/RetreatUI.Launcher.csproj"
          $version = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "The launcher project has no Version value."
          }

          $tag = if ($env:GITHUB_REF -like "refs/tags/launcher-v*") {
            $env:GITHUB_REF_NAME
          } else {
            "launcher-v$version"
          }

          if ($tag -ne "launcher-v$version") {
            throw "Tag $tag does not match project version $version."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore RetreatUI.Launcher.sln

      - name: Build validation
        run: dotnet build RetreatUI.Launcher.sln --configuration Release --no-restore

      - name: Publish single EXE
        run: >-
          dotnet publish RetreatUI.Launcher/RetreatUI.Launcher.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output publish

      - name: Create checksum and ZIP
        shell: pwsh
        run: |
          $exe = "publish/RetreatUI_Launcher.exe"
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RetreatUI_Launcher.exe" | Set-Content -LiteralPath "publish/RetreatUI_Launcher.exe.sha256" -Encoding ascii
          Compress-Archive -Path $exe -DestinationPath RetreatUI_Launcher_win-x64.zip -Force

      - name: Check release state
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            "publish=false" >> $env:GITHUB_OUTPUT
            Write-Host "Release $env:TAG already exists; validation succeeded and publishing is skipped."
          } else {
            "publish=true" >> $env:GITHUB_OUTPUT
          }

      - name: Publish GitHub release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: RetreatUI Launcher v${{ steps.version.outputs.version }}
          body: |
            Launcher ${{ steps.version.outputs.version }} fixes the Burning Crusade label, removes blurred banner artwork, shows only verified addon release assets as Latest on channel, and compares the public feed against live GitHub releases.
          files: |
            publish/RetreatUI_Launcher.exe
            publish/RetreatUI_Launcher.exe.sha256
            RetreatUI_Launcher_win-x64.zip
          make_latest: true
