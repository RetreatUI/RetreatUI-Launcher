name: Build RetreatUI Launcher

on:
  workflow_dispatch:
  push:
    tags:
      - "launcher-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore RetreatUI.Launcher.sln

      - name: Publish single EXE
        run: >-
          dotnet publish RetreatUI.Launcher/RetreatUI.Launcher.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output publish

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path publish/RetreatUI_Launcher.exe -DestinationPath RetreatUI_Launcher_win-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetreatUI-Launcher-win-x64
          path: |
            publish/RetreatUI_Launcher.exe
            RetreatUI_Launcher_win-x64.zip

      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/launcher-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/RetreatUI_Launcher.exe
            RetreatUI_Launcher_win-x64.zip
          generate_release_notes: true
