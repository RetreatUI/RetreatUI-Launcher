name: Publish RetreatUI Launcher v0.2.3

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v0.2.3.yml"

permissions:
  contents: write

concurrency:
  group: publish-retreatui-launcher-v0.2.3
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix duplicate window startup and bump version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $appXamlPath = 'RetreatUI.Launcher/App.xaml'
          $appXaml = Get-Content $appXamlPath -Raw
          $appXaml = [regex]::Replace(
            $appXaml,
            '\s+StartupUri="MainWindow\.xaml"',
            '',
            [System.Text.RegularExpressions.RegexOptions]::IgnoreCase)
          if ($appXaml -match 'StartupUri=') {
            throw 'StartupUri was not removed from App.xaml.'
          }
          Set-Content -Path $appXamlPath -Value $appXaml -Encoding utf8

          $projectPath = 'RetreatUI.Launcher/RetreatUI.Launcher.csproj'
          $project = Get-Content $projectPath -Raw
          $project = $project.Replace('<Version>0.2.2</Version>', '<Version>0.2.3</Version>')
          $project = $project.Replace('<FileVersion>0.2.2.0</FileVersion>', '<FileVersion>0.2.3.0</FileVersion>')
          $project = $project.Replace('<AssemblyVersion>0.2.2.0</AssemblyVersion>', '<AssemblyVersion>0.2.3.0</AssemblyVersion>')
          Set-Content -Path $projectPath -Value $project -Encoding utf8

          $updateServicePath = 'RetreatUI.Launcher/Services/LauncherUpdateService.cs'
          $updateService = Get-Content $updateServicePath -Raw
          $updateService = $updateService.Replace('?? "0.2.2";', '?? "0.2.3";')
          Set-Content -Path $updateServicePath -Value $updateService -Encoding utf8

          $readmePath = 'README.md'
          $readme = Get-Content $readmePath -Raw
          $readme = $readme.Replace('`0.2.2`', '`0.2.3`')
          $readme = $readme.Replace('launcher-v0.2.2', 'launcher-v0.2.3')
          Set-Content -Path $readmePath -Value $readme -Encoding utf8

      - name: Commit v0.2.3 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RetreatUI.Launcher README.md
          git rm .github/workflows/publish-v0.2.3.yml
          git commit -m 'Fix duplicate launcher window and release v0.2.3'
          git push origin HEAD:main

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore RetreatUI.Launcher.sln

      - name: Publish single EXE
        run: >-
          dotnet publish RetreatUI.Launcher/RetreatUI.Launcher.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output publish

      - name: Verify exactly one launcher window
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $executable = (Resolve-Path 'publish/RetreatUI_Launcher.exe').Path
          if ((Get-Item $executable).Length -lt 1000000) {
            throw 'Published launcher executable is unexpectedly small.'
          }

          Add-Type @'
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          using System.Text;

          public static class WindowCounter
          {
              private delegate bool EnumWindowsProc(IntPtr hWnd, IntPtr lParam);

              [DllImport("user32.dll")]
              private static extern bool EnumWindows(EnumWindowsProc callback, IntPtr lParam);

              [DllImport("user32.dll")]
              private static extern uint GetWindowThreadProcessId(IntPtr hWnd, out uint processId);

              [DllImport("user32.dll")]
              private static extern bool IsWindowVisible(IntPtr hWnd);

              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              private static extern int GetWindowText(IntPtr hWnd, StringBuilder text, int maxCount);

              public static string[] GetVisibleWindowTitles(uint targetProcessId)
              {
                  var titles = new List<string>();
                  EnumWindows((hWnd, lParam) =>
                  {
                      GetWindowThreadProcessId(hWnd, out uint processId);
                      if (processId == targetProcessId && IsWindowVisible(hWnd))
                      {
                          var text = new StringBuilder(512);
                          GetWindowText(hWnd, text, text.Capacity);
                          titles.Add(text.ToString());
                      }
                      return true;
                  }, IntPtr.Zero);
                  return titles.ToArray();
              }
          }
          '@

          $process = Start-Process -FilePath $executable -PassThru
          try {
            Start-Sleep -Seconds 8
            $process.Refresh()
            if ($process.HasExited) {
              $logPath = Join-Path $env:LOCALAPPDATA 'RetreatUI Launcher/startup-error.log'
              if (Test-Path $logPath) {
                Get-Content $logPath
              }
              throw "Launcher exited during startup with code $($process.ExitCode)."
            }

            $titles = [WindowCounter]::GetVisibleWindowTitles([uint32]$process.Id)
            Write-Host "Visible launcher windows: $($titles.Count)"
            $titles | ForEach-Object { Write-Host "Window title: $_" }
            if ($titles.Count -ne 1) {
              throw "Expected exactly one visible launcher window, but found $($titles.Count)."
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path publish/RetreatUI_Launcher.exe -DestinationPath RetreatUI_Launcher_win-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetreatUI-Launcher-v0.2.3-win-x64
          path: |
            publish/RetreatUI_Launcher.exe
            RetreatUI_Launcher_win-x64.zip

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'launcher-v0.2.3'
          $releaseSha = (git rev-parse HEAD).Trim()
          $notesPath = 'launcher-v0.2.3-notes.md'

          @'
          ## RetreatUI Launcher v0.2.3

          - Fixed the launcher opening two windows at the same time.
          - Removed the duplicate automatic `StartupUri` launch path and retained the diagnostic startup path.
          - Added an automated test that verifies exactly one visible launcher window before a release is published.
          '@ | Set-Content -Path $notesPath -Encoding utf8

          gh release create $tag `
            publish/RetreatUI_Launcher.exe `
            RetreatUI_Launcher_win-x64.zip `
            --target $releaseSha `
            --title 'RetreatUI Launcher v0.2.3' `
            --notes-file $notesPath
