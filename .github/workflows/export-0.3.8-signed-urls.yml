name: Export signed URLs for launcher 0.3.8

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-0.3.8-signed-urls.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve temporary asset URLs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Refreshing signed asset URLs"
          for spec in \
            "504253279|RetreatUI_Launcher.exe" \
            "504253280|RetreatUI_Launcher.exe.sha256" \
            "504253281|RetreatUI_Launcher_win-x64.zip"; do
            id="${spec%%|*}"
            name="${spec#*|}"
            headers="$(mktemp)"
            curl -sS --fail --max-redirs 0 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -D "$headers" \
              -o /dev/null \
              "https://api.github.com/repos/RetreatUI/RetreatUI-Launcher/releases/assets/$id" || status=$?
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
            test -n "$location"
            echo "SIGNED_URL|$name|$location"
          done