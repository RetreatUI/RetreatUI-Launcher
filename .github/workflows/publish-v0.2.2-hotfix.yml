name: Publish RetreatUI Launcher v0.2.2 Hotfix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v0.2.2-hotfix.yml"

permissions:
  contents: write

concurrency:
  group: publish-retreatui-launcher-v0.2.2
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild safe multi-resolution icon
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check pillow
          @'
          from pathlib import Path
          from PIL import Image

          png = Path("RetreatUI.Launcher/Assets/RetreatUI_Launcher_256.png")
          ico = Path("RetreatUI.Launcher/Assets/RetreatUI_Launcher.ico")
          image = Image.open(png).convert("RGBA")
          image.save(
              ico,
              format="ICO",
              sizes=[(16, 16), (24, 24), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)],
          )
          with Image.open(ico) as check:
              if check.format != "ICO":
                  raise RuntimeError("Generated icon is not a valid ICO file")
          '@ | Set-Content -Path rebuild_icon.py -Encoding utf8
          python rebuild_icon.py
          Remove-Item rebuild_icon.py -Force

      - name: Apply startup hotfix and bump version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $projectPath = 'RetreatUI.Launcher/RetreatUI.Launcher.csproj'
          $project = Get-Content $projectPath -Raw
          $project = $project.Replace('<Version>0.2.1</Version>', '<Version>0.2.2</Version>')
          $project = $project.Replace('<FileVersion>0.2.1.0</FileVersion>', '<FileVersion>0.2.2.0</FileVersion>')
          $project = $project.Replace('<AssemblyVersion>0.2.1.0</AssemblyVersion>', '<AssemblyVersion>0.2.2.0</AssemblyVersion>')
          Set-Content -Path $projectPath -Value $project -Encoding utf8

          $windowPath = 'RetreatUI.Launcher/MainWindow.xaml'
          $window = Get-Content $windowPath -Raw
          $window = $window.Replace("`r`n        Icon=`"Assets/RetreatUI_Launcher.ico`"", '')
          $window = $window.Replace("`n        Icon=`"Assets/RetreatUI_Launcher.ico`"", '')
          Set-Content -Path $windowPath -Value $window -Encoding utf8

          $appXamlPath = 'RetreatUI.Launcher/App.xaml'
          $appXaml = Get-Content $appXamlPath -Raw
          $appXaml = $appXaml.Replace("`r`n              StartupUri=`"MainWindow.xaml`"", '')
          $appXaml = $appXaml.Replace("`n              StartupUri=`"MainWindow.xaml`"", '')
          Set-Content -Path $appXamlPath -Value $appXaml -Encoding utf8

          @'
          using System.IO;
          using System.Windows;
          using System.Windows.Threading;

          namespace RetreatUI.Launcher;

          public partial class App : Application
          {
              protected override void OnStartup(StartupEventArgs e)
              {
                  base.OnStartup(e);
                  DispatcherUnhandledException += OnDispatcherUnhandledException;

                  try
                  {
                      MainWindow = new MainWindow();
                      MainWindow.Show();
                  }
                  catch (Exception ex)
                  {
                      ShowStartupFailure(ex);
                      Shutdown(-1);
                  }
              }

              private void OnDispatcherUnhandledException(object sender, DispatcherUnhandledExceptionEventArgs e)
              {
                  e.Handled = true;
                  ShowStartupFailure(e.Exception);
                  Shutdown(-1);
              }

              private static void ShowStartupFailure(Exception exception)
              {
                  string logPath = WriteStartupLog(exception);
                  MessageBox.Show(
                      $"RetreatUI Launcher could not start.\n\nA diagnostic log was saved here:\n{logPath}\n\n{exception.Message}",
                      "RetreatUI Launcher startup error",
                      MessageBoxButton.OK,
                      MessageBoxImage.Error);
              }

              private static string WriteStartupLog(Exception exception)
              {
                  string directory = Path.Combine(
                      Environment.GetFolderPath(Environment.SpecialFolder.LocalApplicationData),
                      "RetreatUI Launcher");
                  Directory.CreateDirectory(directory);
                  string logPath = Path.Combine(directory, "startup-error.log");
                  File.WriteAllText(
                      logPath,
                      $"UTC: {DateTime.UtcNow:O}{Environment.NewLine}{exception}");
                  return logPath;
              }
          }
          '@ | Set-Content -Path 'RetreatUI.Launcher/App.xaml.cs' -Encoding utf8

          $updateServicePath = 'RetreatUI.Launcher/Services/LauncherUpdateService.cs'
          $updateService = Get-Content $updateServicePath -Raw
          $updateService = $updateService.Replace('?? "0.2.1";', '?? "0.2.2";')
          Set-Content -Path $updateServicePath -Value $updateService -Encoding utf8

          $readmePath = 'README.md'
          $readme = Get-Content $readmePath -Raw
          $readme = $readme.Replace('`0.2.1`', '`0.2.2`')
          $readme = $readme.Replace('launcher-v0.2.1', 'launcher-v0.2.2')
          Set-Content -Path $readmePath -Value $readme -Encoding utf8

      - name: Commit hotfix source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RetreatUI.Launcher README.md
          git rm .github/workflows/publish-v0.2.2-hotfix.yml
          git commit -m 'Fix launcher startup and release v0.2.2'
          git push origin HEAD:main

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore RetreatUI.Launcher.sln

      - name: Publish single EXE
        run: >-
          dotnet publish RetreatUI.Launcher/RetreatUI.Launcher.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output publish

      - name: Smoke-test launcher startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $executable = (Resolve-Path 'publish/RetreatUI_Launcher.exe').Path
          if ((Get-Item $executable).Length -lt 1000000) {
            throw 'Published launcher executable is unexpectedly small.'
          }

          $process = Start-Process -FilePath $executable -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) {
            $logPath = Join-Path $env:LOCALAPPDATA 'RetreatUI Launcher/startup-error.log'
            if (Test-Path $logPath) {
              Write-Host 'Startup diagnostic log:'
              Get-Content $logPath
            }
            throw "Launcher exited during startup with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path publish/RetreatUI_Launcher.exe -DestinationPath RetreatUI_Launcher_win-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetreatUI-Launcher-v0.2.2-win-x64
          path: |
            publish/RetreatUI_Launcher.exe
            RetreatUI_Launcher_win-x64.zip

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'launcher-v0.2.2'
          $releaseSha = (git rev-parse HEAD).Trim()
          $notesPath = 'launcher-v0.2.2-notes.md'

          @'
          ## RetreatUI Launcher v0.2.2

          - Fixed a startup failure introduced by the first icon integration.
          - Rebuilt the application icon as a standards-compliant multi-resolution ICO.
          - Removed the fragile runtime window-icon reference while retaining the branded executable icon and in-launcher logo.
          - Added automatic startup diagnostics at `%LOCALAPPDATA%\RetreatUI Launcher\startup-error.log`.
          - Added a real launch smoke test before publishing the release.
          '@ | Set-Content -Path $notesPath -Encoding utf8

          gh release create $tag `
            publish/RetreatUI_Launcher.exe `
            RetreatUI_Launcher_win-x64.zip `
            --target $releaseSha `
            --title 'RetreatUI Launcher v0.2.2' `
            --notes-file $notesPath
