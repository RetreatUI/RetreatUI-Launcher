name: Apply launcher v0.3.5 rate-limit fix

on:
  push:
    branches:
      - fix/rate-limit-free-feeds-v0.3.5
    paths:
      - ".github/workflows/apply-v0.3.5-rate-limit-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rate-limit-free-feeds-v0.3.5

      - name: Write rate-limit-free release services
        env:
          ADDON_SERVICE_B64: ''
          LAUNCHER_SERVICE_B64: ''
        run: |
          python - <<'PY2'
          import base64, gzip, os
          from pathlib import Path
          files = {
              'RetreatUI.Launcher/Services/GitHubReleaseService.cs': os.environ['ADDON_SERVICE_B64'],
              'RetreatUI.Launcher/Services/LauncherUpdateService.cs': os.environ['LAUNCHER_SERVICE_B64'],
          }
          for path, payload in files.items():
              Path(path).write_bytes(gzip.decompress(base64.b64decode(payload)))
          project = Path('RetreatUI.Launcher/RetreatUI.Launcher.csproj')
          text = project.read_text()
          text = text.replace('<Version>0.3.4</Version>', '<Version>0.3.5</Version>')
          text = text.replace('<FileVersion>0.3.4.0</FileVersion>', '<FileVersion>0.3.5.0</FileVersion>')
          text = text.replace('<AssemblyVersion>0.3.4.0</AssemblyVersion>', '<AssemblyVersion>0.3.5.0</AssemblyVersion>')
          project.write_text(text)
          PY2

      - name: Commit fix
        run: |
          git config user.name "Retreat"
          git config user.email "gaarn94@gmail.com"
          git add RetreatUI.Launcher/Services/GitHubReleaseService.cs \
                  RetreatUI.Launcher/Services/LauncherUpdateService.cs \
                  RetreatUI.Launcher/RetreatUI.Launcher.csproj
          git commit -m "Use CDN release feeds in launcher v0.3.5"
          git push origin HEAD:fix/rate-limit-free-feeds-v0.3.5
