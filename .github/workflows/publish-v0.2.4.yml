name: Publish RetreatUI Launcher v0.2.4

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v0.2.4.yml"

permissions:
  contents: write

concurrency:
  group: publish-retreatui-launcher-v0.2.4
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix self-update downgrade detection
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          @'
          using System.Reflection;
          using System.Text.Json;
          using RetreatUI.Launcher.Models;

          namespace RetreatUI.Launcher.Services;

          public sealed class LauncherUpdateService
          {
              private const string ReleasesUrl = "https://api.github.com/repos/RetreatUI/RetreatUI-Launcher/releases?per_page=30";
              private readonly HttpClient _httpClient;

              public LauncherUpdateService()
              {
                  _httpClient = new HttpClient
                  {
                      Timeout = TimeSpan.FromSeconds(30)
                  };
                  _httpClient.DefaultRequestHeaders.UserAgent.Add(
                      new ProductInfoHeaderValue("RetreatUI-Launcher", CurrentVersion));
                  _httpClient.DefaultRequestHeaders.Accept.Add(
                      new MediaTypeWithQualityHeaderValue("application/vnd.github+json"));
              }

              public string CurrentVersion =>
                  Assembly.GetExecutingAssembly().GetName().Version?.ToString(3) ?? "0.2.4";

              public async Task<LauncherUpdate?> CheckForUpdateAsync(CancellationToken cancellationToken = default)
              {
                  using HttpResponseMessage response = await _httpClient.GetAsync(ReleasesUrl, cancellationToken);
                  if (response.StatusCode == System.Net.HttpStatusCode.NotFound)
                  {
                      return null;
                  }

                  response.EnsureSuccessStatusCode();
                  await using Stream stream = await response.Content.ReadAsStreamAsync(cancellationToken);
                  List<GitHubRelease>? releases = await JsonSerializer.DeserializeAsync<List<GitHubRelease>>(
                      stream,
                      cancellationToken: cancellationToken);

                  if (releases is null || releases.Count == 0)
                  {
                      return null;
                  }

                  LauncherUpdate? bestUpdate = null;
                  foreach (GitHubRelease release in releases)
                  {
                      if (release.Draft || release.Prerelease)
                      {
                          continue;
                      }

                      GitHubAsset? asset = release.Assets.FirstOrDefault(candidate =>
                          string.Equals(candidate.Name, "RetreatUI_Launcher.exe", StringComparison.OrdinalIgnoreCase));
                      if (asset is null)
                      {
                          continue;
                      }

                      string candidateVersion = NormalizeLauncherVersion(release.TagName);
                      if (!IsNewerVersion(candidateVersion, CurrentVersion))
                      {
                          continue;
                      }

                      if (bestUpdate is null || IsNewerVersion(candidateVersion, bestUpdate.Version))
                      {
                          bestUpdate = new LauncherUpdate(candidateVersion, release, asset);
                      }
                  }

                  return bestUpdate;
              }

              public async Task PrepareUpdateAndRestartAsync(
                  LauncherUpdate update,
                  IProgress<double>? progress = null,
                  CancellationToken cancellationToken = default)
              {
                  if (!IsNewerVersion(update.Version, CurrentVersion))
                  {
                      throw new InvalidOperationException(
                          $"Launcher {update.Version} is not newer than the installed launcher {CurrentVersion}.");
                  }

                  string currentExecutable = Environment.ProcessPath
                      ?? throw new InvalidOperationException("The launcher executable path could not be determined.");

                  string updateRoot = Path.Combine(
                      Path.GetTempPath(),
                      "RetreatUI-Launcher",
                      "SelfUpdate",
                      Guid.NewGuid().ToString("N"));
                  Directory.CreateDirectory(updateRoot);

                  string downloadedExecutable = Path.Combine(updateRoot, "RetreatUI_Launcher.exe");
                  string scriptPath = Path.Combine(updateRoot, "apply-update.ps1");

                  using (HttpResponseMessage response = await _httpClient.GetAsync(
                             update.Asset.BrowserDownloadUrl,
                             HttpCompletionOption.ResponseHeadersRead,
                             cancellationToken))
                  {
                      response.EnsureSuccessStatusCode();
                      long? total = response.Content.Headers.ContentLength;
                      await using Stream input = await response.Content.ReadAsStreamAsync(cancellationToken);
                      await using FileStream output = new(
                          downloadedExecutable,
                          FileMode.Create,
                          FileAccess.Write,
                          FileShare.None);

                      byte[] buffer = new byte[81920];
                      long received = 0;
                      int read;
                      while ((read = await input.ReadAsync(buffer, cancellationToken)) > 0)
                      {
                          await output.WriteAsync(buffer.AsMemory(0, read), cancellationToken);
                          received += read;
                          if (total is > 0)
                          {
                              progress?.Report(received * 100d / total.Value);
                          }
                      }
                  }

                  string escapedDownloaded = EscapePowerShellLiteral(downloadedExecutable);
                  string escapedCurrent = EscapePowerShellLiteral(currentExecutable);
                  string escapedRoot = EscapePowerShellLiteral(updateRoot);
                  int processId = Environment.ProcessId;

                  string script = $$"""
                      $ErrorActionPreference = 'Stop'
                      $processIdToWaitFor = {{processId}}
                      while (Get-Process -Id $processIdToWaitFor -ErrorAction SilentlyContinue) {
                          Start-Sleep -Milliseconds 300
                      }
                      Copy-Item -LiteralPath '{{escapedDownloaded}}' -Destination '{{escapedCurrent}}' -Force
                      Start-Process -FilePath '{{escapedCurrent}}'
                      Start-Sleep -Milliseconds 300
                      Remove-Item -LiteralPath '{{escapedRoot}}' -Recurse -Force -ErrorAction SilentlyContinue
                      """;
                  await File.WriteAllTextAsync(scriptPath, script, cancellationToken);

                  Process.Start(new ProcessStartInfo
                  {
                      FileName = "powershell.exe",
                      Arguments = $"-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File \"{scriptPath}\"",
                      UseShellExecute = false,
                      CreateNoWindow = true
                  });
              }

              public static bool IsNewerVersion(string candidate, string installed)
              {
                  Version candidateVersion = ParseVersion(candidate);
                  Version installedVersion = ParseVersion(installed);
                  return candidateVersion > installedVersion;
              }

              private static string EscapePowerShellLiteral(string value) => value.Replace("'", "''");

              private static string NormalizeLauncherVersion(string value)
              {
                  string normalized = value.Trim();
                  if (normalized.StartsWith("launcher-v", StringComparison.OrdinalIgnoreCase))
                  {
                      normalized = normalized[10..];
                  }
                  else
                  {
                      normalized = normalized.TrimStart('v', 'V');
                  }

                  return normalized;
              }

              private static Version ParseVersion(string value)
              {
                  string core = value.Trim().Split('-', 2, StringSplitOptions.RemoveEmptyEntries)[0];
                  return Version.TryParse(core, out Version? version) ? version : new Version(0, 0, 0);
              }
          }

          public sealed record LauncherUpdate(string Version, GitHubRelease Release, GitHubAsset Asset);
          '@ | Set-Content -Path 'RetreatUI.Launcher/Services/LauncherUpdateService.cs' -Encoding utf8

          $mainWindowPath = 'RetreatUI.Launcher/MainWindow.xaml.cs'
          $mainWindow = Get-Content $mainWindowPath -Raw
          $oldGuard = @'
                      _launcherUpdate = await _launcherUpdateService.CheckForUpdateAsync();
                      if (_launcherUpdate is null)
          '@
          $newGuard = @'
                      _launcherUpdate = await _launcherUpdateService.CheckForUpdateAsync();
                      if (_launcherUpdate is null
                          || !LauncherUpdateService.IsNewerVersion(
                              _launcherUpdate.Version,
                              _launcherUpdateService.CurrentVersion))
          '@
          if (-not $mainWindow.Contains($oldGuard)) {
            throw 'Could not locate the launcher update UI guard.'
          }
          $mainWindow = $mainWindow.Replace($oldGuard, $newGuard)
          Set-Content -Path $mainWindowPath -Value $mainWindow -Encoding utf8

          $projectPath = 'RetreatUI.Launcher/RetreatUI.Launcher.csproj'
          $project = Get-Content $projectPath -Raw
          $project = $project.Replace('<Version>0.2.3</Version>', '<Version>0.2.4</Version>')
          $project = $project.Replace('<FileVersion>0.2.3.0</FileVersion>', '<FileVersion>0.2.4.0</FileVersion>')
          $project = $project.Replace('<AssemblyVersion>0.2.3.0</AssemblyVersion>', '<AssemblyVersion>0.2.4.0</AssemblyVersion>')
          Set-Content -Path $projectPath -Value $project -Encoding utf8

          $readmePath = 'README.md'
          $readme = Get-Content $readmePath -Raw
          $readme = $readme.Replace('`0.2.3`', '`0.2.4`')
          $readme = $readme.Replace('launcher-v0.2.3', 'launcher-v0.2.4')
          Set-Content -Path $readmePath -Value $readme -Encoding utf8

      - name: Validate source guard
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $service = Get-Content 'RetreatUI.Launcher/Services/LauncherUpdateService.cs' -Raw
          $window = Get-Content 'RetreatUI.Launcher/MainWindow.xaml.cs' -Raw
          if (-not $service.Contains('return candidateVersion > installedVersion;')) {
            throw 'Strict newer-version comparison is missing.'
          }
          if (-not $service.Contains('if (!IsNewerVersion(update.Version, CurrentVersion))')) {
            throw 'Installation-time downgrade guard is missing.'
          }
          if (-not $window.Contains('LauncherUpdateService.IsNewerVersion(')) {
            throw 'UI downgrade guard is missing.'
          }

      - name: Commit v0.2.4 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RetreatUI.Launcher README.md
          git rm .github/workflows/publish-v0.2.4.yml
          git commit -m 'Fix launcher downgrade prompt and release v0.2.4'
          git push origin HEAD:main

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore RetreatUI.Launcher.sln

      - name: Publish single EXE
        run: >-
          dotnet publish RetreatUI.Launcher/RetreatUI.Launcher.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output publish

      - name: Verify launcher startup and no downgrade prompt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $executable = (Resolve-Path 'publish/RetreatUI_Launcher.exe').Path

          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes

          $process = Start-Process -FilePath $executable -PassThru
          try {
            Start-Sleep -Seconds 10
            $process.Refresh()
            if ($process.HasExited) {
              throw "Launcher exited during startup with code $($process.ExitCode)."
            }

            $root = [System.Windows.Automation.AutomationElement]::RootElement
            $processCondition = New-Object System.Windows.Automation.PropertyCondition(
              [System.Windows.Automation.AutomationElement]::ProcessIdProperty,
              $process.Id)
            $windows = $root.FindAll(
              [System.Windows.Automation.TreeScope]::Children,
              $processCondition)
            if ($windows.Count -ne 1) {
              throw "Expected one launcher window, found $($windows.Count)."
            }

            $buttonCondition = New-Object System.Windows.Automation.PropertyCondition(
              [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
              [System.Windows.Automation.ControlType]::Button)
            $buttons = $windows[0].FindAll(
              [System.Windows.Automation.TreeScope]::Descendants,
              $buttonCondition)
            foreach ($button in $buttons) {
              $name = $button.Current.Name
              if ($name -match '^UPDATE LAUNCHER TO 0\.2\.[0-3]$') {
                throw "Downgrade prompt is visible: $name"
              }
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path publish/RetreatUI_Launcher.exe -DestinationPath RetreatUI_Launcher_win-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetreatUI-Launcher-v0.2.4-win-x64
          path: |
            publish/RetreatUI_Launcher.exe
            RetreatUI_Launcher_win-x64.zip

      - name: Publish stable GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          ## RetreatUI Launcher v0.2.4

          - Prevents the launcher from offering or installing an older launcher version.
          - Selects the highest valid stable launcher release instead of trusting a single latest-release response.
          - Adds independent guards in both the update service and the launcher UI.
          '@ | Set-Content -Path 'launcher-v0.2.4-notes.md' -Encoding utf8

          gh release create 'launcher-v0.2.4' `
            publish/RetreatUI_Launcher.exe `
            RetreatUI_Launcher_win-x64.zip `
            --target "$(git rev-parse HEAD)" `
            --title 'RetreatUI Launcher v0.2.4' `
            --notes-file 'launcher-v0.2.4-notes.md' `
            --latest
