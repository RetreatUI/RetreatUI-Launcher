name: Validate RetreatUI Launcher

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore RetreatUI.Launcher.sln

      - name: Build
        run: dotnet build RetreatUI.Launcher.sln --configuration Release --no-restore

      - name: Publish single EXE
        run: >-
          dotnet publish RetreatUI.Launcher/RetreatUI.Launcher.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output publish

      - name: Validate version and create assets
        shell: pwsh
        run: |
          $exe = "publish/RetreatUI_Launcher.exe"
          if (!(Test-Path -LiteralPath $exe)) { throw "Launcher EXE was not created." }

          [xml]$project = Get-Content -LiteralPath "RetreatUI.Launcher/RetreatUI.Launcher.csproj"
          $expectedVersion = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($expectedVersion)) { throw "The launcher project version is missing." }

          $version = (Get-Item -LiteralPath $exe).VersionInfo.FileVersion
          if (!$version.StartsWith($expectedVersion)) { throw "Unexpected launcher version: $version (expected $expectedVersion)" }

          "LAUNCHER_VERSION=$expectedVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RetreatUI_Launcher.exe" | Set-Content -LiteralPath "publish/RetreatUI_Launcher.exe.sha256" -Encoding ascii
          Compress-Archive -Path $exe -DestinationPath RetreatUI_Launcher_win-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetreatUI-Launcher-v${{ env.LAUNCHER_VERSION }}
          path: |
            publish/RetreatUI_Launcher.exe
            publish/RetreatUI_Launcher.exe.sha256
            RetreatUI_Launcher_win-x64.zip
          if-no-files-found: error
