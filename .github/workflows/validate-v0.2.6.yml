name: Validate RetreatUI Launcher

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "RetreatUI.Launcher/**"
      - "RetreatUI.Launcher.sln"
      - ".github/workflows/validate-v0.2.6.yml"

permissions:
  contents: read

concurrency:
  group: retreatui-launcher-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore RetreatUI.Launcher.sln

      - name: Build
        run: dotnet build RetreatUI.Launcher.sln --configuration Release --no-restore
