name: Apply RetreatUI Launcher v0.3.4 exact theme

on:
  push:
    branches:
      - feature/clean-integrated-logos-v0.3.4
    paths:
      - ".github/workflows/apply-v0.3.4-theme.yml"

permissions:
  contents: write

jobs:
  apply-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/clean-integrated-logos-v0.3.4

      - name: Write reference-matched launcher files
        env:
          APP_B64: ''
          MAIN_B64: ''
          PROJ_B64: ''
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          import os, gzip, base64, pathlib
          files = {
              'RetreatUI.Launcher/App.xaml': os.environ['APP_B64'],
              'RetreatUI.Launcher/MainWindow.xaml': os.environ['MAIN_B64'],
              'RetreatUI.Launcher/RetreatUI.Launcher.csproj': os.environ['PROJ_B64'],
          }
          for path, encoded in files.items():
              pathlib.Path(path).write_bytes(gzip.decompress(base64.b64decode(encoded)))
          PY2
          python3 - <<'PY2'
          import xml.etree.ElementTree as ET
          for path in ['RetreatUI.Launcher/App.xaml','RetreatUI.Launcher/MainWindow.xaml','RetreatUI.Launcher/RetreatUI.Launcher.csproj']:
              ET.parse(path)
              print('XML OK:', path)
          PY2

      - name: Commit v0.3.4 theme
        shell: bash
        run: |
          git config user.name "Retreat"
          git config user.email "gaarn94@gmail.com"
          git add RetreatUI.Launcher/App.xaml RetreatUI.Launcher/MainWindow.xaml RetreatUI.Launcher/RetreatUI.Launcher.csproj
          git commit -m "Match launcher v0.3.4 to approved reference" || exit 0
          git push origin HEAD:feature/clean-integrated-logos-v0.3.4
