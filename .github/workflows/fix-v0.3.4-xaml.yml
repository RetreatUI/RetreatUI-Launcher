name: Fix RetreatUI Launcher v0.3.4 WPF typography

on:
  push:
    branches:
      - feature/clean-integrated-logos-v0.3.4
    paths:
      - ".github/workflows/fix-v0.3.4-xaml.yml"

permissions:
  contents: write

jobs:
  fix-xaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/clean-integrated-logos-v0.3.4

      - name: Remove unsupported WPF CharacterSpacing properties
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('RetreatUI.Launcher/MainWindow.xaml')
          text = path.read_text()
          text = text.replace('FontWeight="Normal"\n                                       CharacterSpacing="28"/>', 'FontWeight="Normal"/>')
          text = text.replace('FontWeight="Bold"\n                                               CharacterSpacing="8"/>', 'FontWeight="Bold"/>')
          path.write_text(text)

          import xml.etree.ElementTree as ET
          ET.parse(path)
          if 'CharacterSpacing' in text:
              raise SystemExit('CharacterSpacing is still present')
          print('WPF XAML typography fixed and XML validated')
          PY

      - name: Commit WPF fix
        shell: bash
        run: |
          git config user.name "Retreat"
          git config user.email "gaarn94@gmail.com"
          git add RetreatUI.Launcher/MainWindow.xaml
          git commit -m "Fix v0.3.4 WPF typography" || exit 0
          git push origin HEAD:feature/clean-integrated-logos-v0.3.4
