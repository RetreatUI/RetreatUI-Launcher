name: Apply launcher v0.3.6 reference layout

on:
  push:
    branches:
      - fix/reference-accurate-layout-v0.3.6
    paths:
      - ".github/workflows/apply-v0.3.6-reference-layout.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reference-accurate-layout-v0.3.6

      - name: Write reference-aligned launcher files
        env:
          MAIN_WINDOW_B64: ''
          APP_XAML_B64: ''
          CSPROJ_B64: ''
        run: |
          python3 - <<'PY2'
          import os, gzip, base64
          from pathlib import Path
          files = {
              'RetreatUI.Launcher/MainWindow.xaml': os.environ['MAIN_WINDOW_B64'],
              'RetreatUI.Launcher/App.xaml': os.environ['APP_XAML_B64'],
              'RetreatUI.Launcher/RetreatUI.Launcher.csproj': os.environ['CSPROJ_B64'],
          }
          for path, payload in files.items():
              Path(path).write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY2

      - name: Commit layout
        run: |
          git config user.name "Retreat"
          git config user.email "gaarn94@gmail.com"
          git add RetreatUI.Launcher/MainWindow.xaml RetreatUI.Launcher/App.xaml RetreatUI.Launcher/RetreatUI.Launcher.csproj
          git commit -m "Match approved launcher reference in v0.3.6"
          git push origin HEAD:fix/reference-accurate-layout-v0.3.6
