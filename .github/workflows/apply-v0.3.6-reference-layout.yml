name: Remove temporary v0.3.6 workflow

on:
  push:
    branches:
      - fix/reference-accurate-layout-v0.3.6
    paths:
      - ".github/workflows/apply-v0.3.6-reference-layout.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reference-accurate-layout-v0.3.6

      - name: Remove temporary workflow
        run: |
          git config user.name "Retreat"
          git config user.email "gaarn94@gmail.com"
          git rm .github/workflows/apply-v0.3.6-reference-layout.yml
          git commit -m "Remove temporary v0.3.6 workflow"
          git push origin HEAD:fix/reference-accurate-layout-v0.3.6
