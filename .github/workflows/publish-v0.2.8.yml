name: Build RetreatUI Launcher v0.2.8

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: build-retreatui-launcher-v0.2.8
  cancel-in-progress: false

jobs:
  build:
    if: github.event.pull_request.head.ref == 'release/launcher-v0.2.8'
    runs-on: windows-latest

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply v0.2.8 source changes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Replace-Exact {
            param(
              [string]$Path,
              [string]$Old,
              [string]$New,
              [string]$Label
            )

            $content = Get-Content -LiteralPath $Path -Raw
            if (-not $content.Contains($Old)) {
              throw "Could not locate $Label in $Path."
            }
            $content = $content.Replace($Old, $New)
            Set-Content -LiteralPath $Path -Value $content -Encoding utf8
          }

          $xamlPath = 'RetreatUI.Launcher/MainWindow.xaml'
          $oldFooter = @'
                  <Grid Grid.Row="8">
                      <Grid.ColumnDefinitions>
                          <ColumnDefinition Width="*"/>
                          <ColumnDefinition Width="Auto"/>
                          <ColumnDefinition Width="10"/>
                          <ColumnDefinition Width="Auto"/>
                      </Grid.ColumnDefinitions>
                      <StackPanel Orientation="Horizontal" VerticalAlignment="Center">
                          <Ellipse x:Name="StatusDot"
                                   Width="9"
                                   Height="9"
                                   Fill="{StaticResource MutedTextBrush}"
                                   Margin="0,0,8,0"/>
                          <TextBlock x:Name="StatusText"
                                     Text="Starting launcher..."
                                     Foreground="{StaticResource MutedTextBrush}"
                                     VerticalAlignment="Center"/>
                      </StackPanel>
                      <Button x:Name="OpenFolderButton"
                              Grid.Column="1"
                              Content="Open AddOns Folder"
                              Style="{StaticResource SecondaryButtonStyle}"
                              IsEnabled="False"
                              Click="OpenFolderButton_Click"/>
                      <Button x:Name="LaunchButton"
                              Grid.Column="3"
                              Content="Launch Ascension"
                              Style="{StaticResource SecondaryButtonStyle}"
                              IsEnabled="False"
                              Click="LaunchButton_Click"/>
                  </Grid>
          '@
          $newFooter = @'
                  <Grid Grid.Row="8">
                      <Grid.ColumnDefinitions>
                          <ColumnDefinition Width="*"/>
                          <ColumnDefinition Width="Auto"/>
                          <ColumnDefinition Width="10"/>
                          <ColumnDefinition Width="Auto"/>
                          <ColumnDefinition Width="10"/>
                          <ColumnDefinition Width="Auto"/>
                      </Grid.ColumnDefinitions>
                      <StackPanel Orientation="Horizontal" VerticalAlignment="Center">
                          <Ellipse x:Name="StatusDot"
                                   Width="9"
                                   Height="9"
                                   Fill="{StaticResource MutedTextBrush}"
                                   Margin="0,0,8,0"/>
                          <TextBlock x:Name="StatusText"
                                     Text="Starting launcher..."
                                     Foreground="{StaticResource MutedTextBrush}"
                                     VerticalAlignment="Center"/>
                      </StackPanel>
                      <Button x:Name="SupportButton"
                              Grid.Column="1"
                              Content="Support RetreatUI"
                              Style="{StaticResource SecondaryButtonStyle}"
                              ToolTip="Support RetreatUI development on Ko-fi"
                              Click="SupportButton_Click"/>
                      <Button x:Name="OpenFolderButton"
                              Grid.Column="3"
                              Content="Open AddOns Folder"
                              Style="{StaticResource SecondaryButtonStyle}"
                              IsEnabled="False"
                              Click="OpenFolderButton_Click"/>
                      <Button x:Name="LaunchButton"
                              Grid.Column="5"
                              Content="Launch Ascension"
                              Style="{StaticResource SecondaryButtonStyle}"
                              IsEnabled="False"
                              Click="LaunchButton_Click"/>
                  </Grid>
          '@
          Replace-Exact $xamlPath $oldFooter $newFooter 'launcher footer'

          $windowPath = 'RetreatUI.Launcher/MainWindow.xaml.cs'
          Replace-Exact $windowPath @'
          public partial class MainWindow : Window
          {
              private readonly SettingsService _settingsService = new();
          '@ @'
          public partial class MainWindow : Window
          {
              private const string SupportUrl = "https://ko-fi.com/retreatui";

              private readonly SettingsService _settingsService = new();
          '@ 'support URL constant'

          Replace-Exact $windowPath @'
              private bool _isBusy;
              private bool _isInitialized;
          '@ @'
              private bool _isBusy;
              private bool _isInitialized;
              private bool _automaticLauncherUpdateInProgress;
              private bool _automaticAddonUpdateInProgress;
          '@ 'automatic update state fields'

          Replace-Exact $windowPath @'
              UpdatePathDisplay();
              await RefreshAsync();
              await CheckLauncherUpdateAsync();
          '@ @'
              UpdatePathDisplay();
              await CheckLauncherUpdateAsync();
              if (TryInstallLauncherUpdateAutomatically())
              {
                  return;
              }

              await RefreshAsync();
              TryInstallAddonUpdateAutomatically();
          '@ 'startup update order'

          Replace-Exact $windowPath @'
              private async Task CheckLauncherUpdateAsync()
          '@ @'
              private bool TryInstallLauncherUpdateAutomatically()
              {
                  if (_launcherUpdate is null
                      || _isBusy
                      || !LauncherUpdateService.IsNewerVersion(
                          _launcherUpdate.Version,
                          _launcherUpdateService.CurrentVersion))
                  {
                      return false;
                  }

                  _automaticLauncherUpdateInProgress = true;
                  LauncherUpdateButton_Click(LauncherUpdateButton, new RoutedEventArgs());
                  return true;
              }

              private void TryInstallAddonUpdateAutomatically()
              {
                  if (_currentAddonAction != AddonAction.Update
                      || _latestRelease is null
                      || _isBusy
                      || !_gamePathService.HasValidAddOnsPath(_settings.AddOnsPath))
                  {
                      return;
                  }

                  string latestVersion = NormalizeVersion(_latestRelease.TagName);
                  if (_installerService.IsGameRunning())
                  {
                      SetStatus(
                          $"RetreatUI {latestVersion} is ready. Close Project Ascension and press Refresh to install it automatically.",
                          StatusKind.Neutral);
                      return;
                  }

                  _automaticAddonUpdateInProgress = true;
                  UpdateButton_Click(UpdateButton, new RoutedEventArgs());
              }

              private async Task CheckLauncherUpdateAsync()
          '@ 'automatic update helpers'

          Replace-Exact $windowPath @'
                  MessageBoxResult confirmation = MessageBox.Show(
                      this,
                      $"Install RetreatUI Launcher {_launcherUpdate.Version} now? The launcher will restart automatically.",
                      "Update RetreatUI Launcher",
                      MessageBoxButton.YesNo,
                      MessageBoxImage.Information);
                  if (confirmation != MessageBoxResult.Yes)
                  {
                      return;
                  }
          '@ @'
                  if (!_automaticLauncherUpdateInProgress)
                  {
                      MessageBoxResult confirmation = MessageBox.Show(
                          this,
                          $"Install RetreatUI Launcher {_launcherUpdate.Version} now? The launcher will restart automatically.",
                          "Update RetreatUI Launcher",
                          MessageBoxButton.YesNo,
                          MessageBoxImage.Information);
                      if (confirmation != MessageBoxResult.Yes)
                      {
                          return;
                      }
                  }
          '@ 'manual launcher confirmation guard'

          Replace-Exact $windowPath @'
                      SetStatus(status, StatusKind.Success);
                      MessageBox.Show(this, message, title, MessageBoxButton.OK, MessageBoxImage.Information);
          '@ @'
                      SetStatus(status, StatusKind.Success);
                      if (!_automaticAddonUpdateInProgress)
                      {
                          MessageBox.Show(this, message, title, MessageBoxButton.OK, MessageBoxImage.Information);
                      }
          '@ 'automatic addon completion dialog suppression'

          Replace-Exact $windowPath @'
                      TryDelete(zipPath);
                      DownloadProgress.Visibility = Visibility.Collapsed;
                      SetBusy(false);
                  }
              }

              private async Task CheckLauncherUpdateAsync()
          '@ @'
                      TryDelete(zipPath);
                      DownloadProgress.Visibility = Visibility.Collapsed;
                      SetBusy(false);
                      _automaticAddonUpdateInProgress = false;
                  }
              }

              private bool TryInstallLauncherUpdateAutomatically()
          '@ 'addon automatic state cleanup and helper placement'

          Replace-Exact $windowPath @'
                      DownloadProgress.Visibility = Visibility.Collapsed;
                      SetBusy(false);
                  }
              }

              private async void ChooseFolderButton_Click(object sender, RoutedEventArgs e)
          '@ @'
                      DownloadProgress.Visibility = Visibility.Collapsed;
                      SetBusy(false);

                      bool wasAutomatic = _automaticLauncherUpdateInProgress;
                      _automaticLauncherUpdateInProgress = false;
                      if (wasAutomatic)
                      {
                          await RefreshAsync();
                          TryInstallAddonUpdateAutomatically();
                      }
                  }
              }

              private async void ChooseFolderButton_Click(object sender, RoutedEventArgs e)
          '@ 'automatic launcher failure fallback'

          Replace-Exact $windowPath @'
              private async void RefreshButton_Click(object sender, RoutedEventArgs e)
              {
                  await RefreshAsync();
                  await CheckLauncherUpdateAsync();
              }
          '@ @'
              private async void RefreshButton_Click(object sender, RoutedEventArgs e)
              {
                  await CheckLauncherUpdateAsync();
                  if (TryInstallLauncherUpdateAutomatically())
                  {
                      return;
                  }

                  await RefreshAsync();
                  TryInstallAddonUpdateAutomatically();
              }
          '@ 'refresh automatic update order'

          Replace-Exact $windowPath @'
              private void OpenFolderButton_Click(object sender, RoutedEventArgs e)
          '@ @'
              private void SupportButton_Click(object sender, RoutedEventArgs e)
              {
                  try
                  {
                      Process.Start(new ProcessStartInfo
                      {
                          FileName = SupportUrl,
                          UseShellExecute = true
                      });
                  }
                  catch (Exception ex)
                  {
                      MessageBox.Show(
                          this,
                          $"The support page could not be opened.\n\n{ex.Message}",
                          "Support RetreatUI",
                          MessageBoxButton.OK,
                          MessageBoxImage.Information);
                  }
              }

              private void OpenFolderButton_Click(object sender, RoutedEventArgs e)
          '@ 'Ko-fi support handler'

          $projectPath = 'RetreatUI.Launcher/RetreatUI.Launcher.csproj'
          $project = Get-Content -LiteralPath $projectPath -Raw
          $project = $project.Replace('<Version>0.2.7</Version>', '<Version>0.2.8</Version>')
          $project = $project.Replace('<FileVersion>0.2.7.0</FileVersion>', '<FileVersion>0.2.8.0</FileVersion>')
          $project = $project.Replace('<AssemblyVersion>0.2.7.0</AssemblyVersion>', '<AssemblyVersion>0.2.8.0</AssemblyVersion>')
          if (-not $project.Contains('<Version>0.2.8</Version>')) {
            throw 'Launcher project version was not updated to 0.2.8.'
          }
          Set-Content -LiteralPath $projectPath -Value $project -Encoding utf8

          $launcherUpdatePath = 'RetreatUI.Launcher/Services/LauncherUpdateService.cs'
          $launcherUpdate = Get-Content -LiteralPath $launcherUpdatePath -Raw
          $launcherUpdate = $launcherUpdate.Replace('?? "0.2.7";', '?? "0.2.8";')
          if (-not $launcherUpdate.Contains('?? "0.2.8";')) {
            throw 'Launcher update fallback version was not updated.'
          }
          Set-Content -LiteralPath $launcherUpdatePath -Value $launcherUpdate -Encoding utf8

          $releaseServicePath = 'RetreatUI.Launcher/Services/GitHubReleaseService.cs'
          $releaseService = Get-Content -LiteralPath $releaseServicePath -Raw
          $releaseService = $releaseService.Replace('new ProductInfoHeaderValue("RetreatUI-Launcher", "0.2.5")', 'new ProductInfoHeaderValue("RetreatUI-Launcher", "0.2.8")')
          if (-not $releaseService.Contains('new ProductInfoHeaderValue("RetreatUI-Launcher", "0.2.8")')) {
            throw 'Addon release user agent was not updated.'
          }
          Set-Content -LiteralPath $releaseServicePath -Value $releaseService -Encoding utf8

          $readmePath = 'README.md'
          $readme = Get-Content -LiteralPath $readmePath -Raw
          $readme = $readme.Replace('`0.2.6`', '`0.2.8`')
          $readme = $readme.Replace('launcher-v0.2.6', 'launcher-v0.2.8')
          $featureAnchor = '- One-click RetreatUI installation and updating'
          $featureReplacement = @'
          - One-click RetreatUI installation and updating
          - Automatic RetreatUI updates on the selected channel when Project Ascension is closed
          - A discreet Support RetreatUI button linking to the official Ko-fi page
          '@
          $featureReplacement = $featureReplacement.Trim()
          if ($readme.Contains($featureAnchor) -and -not $readme.Contains('official Ko-fi page')) {
            $readme = $readme.Replace($featureAnchor, $featureReplacement)
          }
          Set-Content -LiteralPath $readmePath -Value $readme -Encoding utf8

      - name: Validate v0.2.8 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $xaml = Get-Content 'RetreatUI.Launcher/MainWindow.xaml' -Raw
          $window = Get-Content 'RetreatUI.Launcher/MainWindow.xaml.cs' -Raw
          $project = Get-Content 'RetreatUI.Launcher/RetreatUI.Launcher.csproj' -Raw
          $launcherUpdate = Get-Content 'RetreatUI.Launcher/Services/LauncherUpdateService.cs' -Raw

          if (-not $xaml.Contains('Content="Support RetreatUI"')) { throw 'Support button is missing.' }
          if (-not $window.Contains('https://ko-fi.com/retreatui')) { throw 'Ko-fi URL is missing.' }
          if (-not $window.Contains('TryInstallLauncherUpdateAutomatically')) { throw 'Automatic launcher update is missing.' }
          if (-not $window.Contains('TryInstallAddonUpdateAutomatically')) { throw 'Automatic addon update is missing.' }
          if (-not $window.Contains('_currentAddonAction != AddonAction.Update')) { throw 'Manual install/channel protection is missing.' }
          if (-not $window.Contains('_installerService.IsGameRunning()')) { throw 'Running-game protection is missing.' }
          if (-not $project.Contains('<Version>0.2.8</Version>')) { throw 'Project version is incorrect.' }
          if (-not $launcherUpdate.Contains('?? "0.2.8";')) { throw 'Runtime version fallback is incorrect.' }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore RetreatUI.Launcher.sln

      - name: Build launcher
        run: dotnet build RetreatUI.Launcher.sln --configuration Release --no-restore

      - name: Publish single EXE
        run: >-
          dotnet publish RetreatUI.Launcher/RetreatUI.Launcher.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output publish

      - name: Verify launcher startup and support button
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $executable = (Resolve-Path 'publish/RetreatUI_Launcher.exe').Path
          $version = (Get-Item $executable).VersionInfo.FileVersion
          if (-not $version.StartsWith('0.2.8')) {
            throw "Published launcher reports file version $version."
          }

          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $process = Start-Process -FilePath $executable -PassThru
          try {
            Start-Sleep -Seconds 10
            $process.Refresh()
            if ($process.HasExited) {
              throw "Launcher exited during startup with code $($process.ExitCode)."
            }

            $root = [System.Windows.Automation.AutomationElement]::RootElement
            $processCondition = New-Object System.Windows.Automation.PropertyCondition(
              [System.Windows.Automation.AutomationElement]::ProcessIdProperty,
              $process.Id)
            $window = $root.FindFirst(
              [System.Windows.Automation.TreeScope]::Children,
              $processCondition)
            if ($null -eq $window) {
              throw 'Launcher window was not found.'
            }

            $nameCondition = New-Object System.Windows.Automation.PropertyCondition(
              [System.Windows.Automation.AutomationElement]::NameProperty,
              'Support RetreatUI')
            $supportButton = $window.FindFirst(
              [System.Windows.Automation.TreeScope]::Descendants,
              $nameCondition)
            if ($null -eq $supportButton) {
              throw 'Support RetreatUI button was not found through UI Automation.'
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Create checksum and ZIP
        shell: pwsh
        run: |
          $exe = 'publish/RetreatUI_Launcher.exe'
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RetreatUI_Launcher.exe" | Set-Content -LiteralPath 'publish/RetreatUI_Launcher.exe.sha256' -Encoding ascii
          Compress-Archive -Path $exe -DestinationPath 'RetreatUI_Launcher_win-x64.zip' -Force

      - name: Commit v0.2.8 source to main
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add `
            RetreatUI.Launcher/MainWindow.xaml `
            RetreatUI.Launcher/MainWindow.xaml.cs `
            RetreatUI.Launcher/RetreatUI.Launcher.csproj `
            RetreatUI.Launcher/Services/GitHubReleaseService.cs `
            RetreatUI.Launcher/Services/LauncherUpdateService.cs `
            README.md
          git rm '.github/workflows/publish-v0.2.8.yml'
          git commit -m 'Add automatic updates and Ko-fi support button in launcher v0.2.8'
          git push origin HEAD:main

      - name: Upload verified launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetreatUI-Launcher-v0.2.8-win-x64
          path: |
            publish/RetreatUI_Launcher.exe
            publish/RetreatUI_Launcher.exe.sha256
            RetreatUI_Launcher_win-x64.zip
          if-no-files-found: error
