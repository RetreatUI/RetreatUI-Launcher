name: Apply RetreatUI Launcher v0.3.3 theme

on:
  push:
    branches:
      - feature/mockup-accurate-theme-v0.3.3
    paths:
      - ".github/workflows/apply-v0.3.3-theme.yml"

permissions:
  contents: write

jobs:
  apply-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mockup-accurate-theme-v0.3.3

      - name: Write validated theme files
        env:
          APP_B64: ''
          MAIN_B64: ''
          CSPROJ_B64: ''
        run: |
          python3 - <<'PY'
          import base64, gzip, os
          from pathlib import Path
          root = Path('RetreatUI.Launcher')
          files = {
              'App.xaml': os.environ['APP_B64'],
              'MainWindow.xaml': os.environ['MAIN_B64'],
              'RetreatUI.Launcher.csproj': os.environ['CSPROJ_B64'],
          }
          for name, value in files.items():
              (root / name).write_bytes(gzip.decompress(base64.b64decode(value)))
          PY

      - name: Commit theme update
        run: |
          git config user.name "Retreat"
          git config user.email "gaarn94@gmail.com"
          git add RetreatUI.Launcher/App.xaml RetreatUI.Launcher/MainWindow.xaml RetreatUI.Launcher/RetreatUI.Launcher.csproj
          git diff --cached --quiet || git commit -m "Match launcher v0.3.3 to approved dark fantasy design"
          git push origin HEAD:feature/mockup-accurate-theme-v0.3.3
