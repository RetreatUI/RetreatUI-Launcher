name: Publish RetreatUI Launcher v0.2.1

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v0.2.1.yml"

permissions:
  contents: write

concurrency:
  group: publish-retreatui-launcher-v0.2.1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and prepare RetreatUI branding
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $assetsDirectory = 'RetreatUI.Launcher/Assets'
          $pngPath = Join-Path $assetsDirectory 'RetreatUI_Launcher_256.png'
          $icoPath = Join-Path $assetsDirectory 'RetreatUI_Launcher.ico'

          New-Item -ItemType Directory -Path $assetsDirectory -Force | Out-Null
          Invoke-WebRequest `
            -Uri 'https://at.adobe.com/W9IAzHdjB95CgU0I' `
            -OutFile $pngPath `
            -MaximumRedirection 10

          $pngBytes = [System.IO.File]::ReadAllBytes($pngPath)
          if ($pngBytes.Length -lt 1000) {
            throw 'Downloaded launcher logo is unexpectedly small.'
          }

          $pngSignature = [byte[]](137, 80, 78, 71, 13, 10, 26, 10)
          for ($index = 0; $index -lt $pngSignature.Length; $index++) {
            if ($pngBytes[$index] -ne $pngSignature[$index]) {
              throw 'Downloaded launcher logo is not a valid PNG file.'
            }
          }

          # Create a Windows ICO containing the exact 256x256 PNG artwork.
          $iconHeader = New-Object byte[] 22
          [BitConverter]::GetBytes([UInt16]0).CopyTo($iconHeader, 0)
          [BitConverter]::GetBytes([UInt16]1).CopyTo($iconHeader, 2)
          [BitConverter]::GetBytes([UInt16]1).CopyTo($iconHeader, 4)
          $iconHeader[6] = 0
          $iconHeader[7] = 0
          $iconHeader[8] = 0
          $iconHeader[9] = 0
          [BitConverter]::GetBytes([UInt16]1).CopyTo($iconHeader, 10)
          [BitConverter]::GetBytes([UInt16]32).CopyTo($iconHeader, 12)
          [BitConverter]::GetBytes([UInt32]$pngBytes.Length).CopyTo($iconHeader, 14)
          [BitConverter]::GetBytes([UInt32]22).CopyTo($iconHeader, 18)
          [System.IO.File]::WriteAllBytes($icoPath, [byte[]]($iconHeader + $pngBytes))

          if ((Get-Item $icoPath).Length -le (Get-Item $pngPath).Length) {
            throw 'The generated application icon failed validation.'
          }

      - name: Commit branding assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RetreatUI.Launcher/Assets/RetreatUI_Launcher.ico
          git add RetreatUI.Launcher/Assets/RetreatUI_Launcher_256.png
          git rm .github/workflows/publish-v0.2.1.yml
          git commit -m 'Add RetreatUI launcher icon and logo'
          git push origin HEAD:main

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore RetreatUI.Launcher.sln

      - name: Publish single EXE
        run: >-
          dotnet publish RetreatUI.Launcher/RetreatUI.Launcher.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output publish

      - name: Verify published launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $executable = 'publish/RetreatUI_Launcher.exe'
          if (-not (Test-Path $executable)) {
            throw 'RetreatUI_Launcher.exe was not created.'
          }
          if ((Get-Item $executable).Length -lt 1000000) {
            throw 'The published launcher executable is unexpectedly small.'
          }

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path publish/RetreatUI_Launcher.exe -DestinationPath RetreatUI_Launcher_win-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetreatUI-Launcher-v0.2.1-win-x64
          path: |
            publish/RetreatUI_Launcher.exe
            RetreatUI_Launcher_win-x64.zip

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'launcher-v0.2.1'
          $releaseSha = (git rev-parse HEAD).Trim()
          $notesPath = 'launcher-v0.2.1-notes.md'

          @'
          ## RetreatUI Launcher v0.2.1

          - Added the custom RetreatUI application icon to the executable, taskbar, Alt+Tab and window title.
          - Added the RetreatUI logo directly to the launcher header.
          - Updated the launcher version and self-update metadata to 0.2.1.
          - Includes all updater, Stable/Beta channel, validation, backup and rollback improvements from v0.2.0.
          '@ | Set-Content -Path $notesPath -Encoding utf8

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --title 'RetreatUI Launcher v0.2.1' --notes-file $notesPath --target $releaseSha
            gh release upload $tag publish/RetreatUI_Launcher.exe RetreatUI_Launcher_win-x64.zip --clobber
          }
          else {
            gh release create $tag `
              publish/RetreatUI_Launcher.exe `
              RetreatUI_Launcher_win-x64.zip `
              --target $releaseSha `
              --title 'RetreatUI Launcher v0.2.1' `
              --notes-file $notesPath
          }
